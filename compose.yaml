services:
  core-platform:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    environment:
      ASOC_PORT: "8080"
      ASOC_DEMO_TENANT_ID: tenant-demo
      ASOC_DEMO_TENANT_NAME: Demo Security Org
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - core-platform
