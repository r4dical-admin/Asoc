<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incident Console Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #111827;
        color: #e5e7eb;
      }
      .layout {
        display: grid;
        grid-template-columns: 290px 1fr 320px;
        height: calc(100vh - 52px);
      }
      .pane {
        overflow: auto;
        padding: 16px;
      }
      .left { border-right: 1px solid #374151; }
      .right { border-left: 1px solid #374151; }
      .topbar {
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid #374151;
        background: #0f172a;
      }
      h2 { margin: 0 0 12px; font-size: 15px; color: #f9fafb; }
      .group { margin-bottom: 14px; }
      .group-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: #f3f4f6;
      }
      button.link {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        color: #cbd5e1;
        padding: 7px 10px;
        margin: 3px 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button.link:hover { background: #1f2937; }
      button.link.active {
        background: #1d4ed8;
        color: #eff6ff;
      }
      .workspace {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        border-bottom: 1px solid #374151;
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .tab {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: #1f2937;
        color: #d1d5db;
        border: 1px solid #374151;
      }
      .tab.active {
        background: #0ea5e9;
        color: #082f49;
        border-color: #0284c7;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 8px;
        padding: 14px;
        min-height: 210px;
      }
      .muted { color: #94a3b8; font-size: 13px; }
      .footer {
        height: 52px;
        border-top: 1px solid #374151;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: #0f172a;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="topbar">Incident Console Demo • File-backed SPA</div>
    <div class="layout">
      <aside class="pane left">
        <h2>Active Incidents</h2>
        <div id="incidents"></div>
      </aside>

      <main class="pane workspace">
        <div class="tabs" id="tabs"></div>
        <h2 id="viewer-title">Welcome</h2>
        <p class="muted" id="viewer-meta">Open a link from either pane to load its file via the local server.</p>
        <pre id="viewer-content">No file selected.</pre>
      </main>

      <aside class="pane right">
        <h2>Resources</h2>
        <div id="resources"></div>
      </aside>
    </div>
    <div class="footer">Background tasks: correlation jobs, enrichments, and triage automation.</div>

    <script>
      const resourceLabels = {
        workflows: 'Workflows',
        'knowledge-base': 'Knowledge Base',
        'historic-rcas-sev1s': 'Historic RCAs / SEV1s',
        skills: 'Skills',
        'data-sources': 'Data Sources',
        'mcps-integrations': 'MCPs / Integrations',
        intakes: 'Intakes',
      };

      const state = {
        tabs: [],
        activeKey: null,
      };

      const incidentsContainer = document.getElementById('incidents');
      const resourcesContainer = document.getElementById('resources');
      const tabsContainer = document.getElementById('tabs');
      const titleEl = document.getElementById('viewer-title');
      const metaEl = document.getElementById('viewer-meta');
      const contentEl = document.getElementById('viewer-content');

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${url}`);
        return response.json();
      }

      function createLink(label, onClick, key) {
        const btn = document.createElement('button');
        btn.className = 'link' + (state.activeKey === key ? ' active' : '');
        btn.textContent = label;
        btn.onclick = onClick;
        return btn;
      }

      function renderTabs() {
        tabsContainer.innerHTML = '';
        state.tabs.forEach((tab) => {
          const item = document.createElement('span');
          item.className = 'tab' + (tab.key === state.activeKey ? ' active' : '');
          item.textContent = tab.label;
          tabsContainer.appendChild(item);
        });
      }

      function refreshNavActiveState() {
        document.querySelectorAll('button.link').forEach((btn) => {
          if (btn.dataset.key === state.activeKey) btn.classList.add('active');
          else btn.classList.remove('active');
        });
      }

      function addTab(tab) {
        if (!state.tabs.some((existing) => existing.key === tab.key)) {
          state.tabs.push(tab);
        }
        state.activeKey = tab.key;
        renderTabs();
        refreshNavActiveState();
      }

      async function openFile(tabInfo) {
        addTab(tabInfo);
        titleEl.textContent = tabInfo.label;
        metaEl.textContent = `${tabInfo.scope} • ${tabInfo.section} • ${tabInfo.file}`;
        contentEl.textContent = 'Loading...';

        try {
          const params = new URLSearchParams({
            scope: tabInfo.scope,
            section: tabInfo.section,
            name: tabInfo.file,
          });
          const response = await fetch(`/api/file?${params.toString()}`);
          if (!response.ok) throw new Error('Unable to load file.');
          const text = await response.text();
          contentEl.textContent = text;
        } catch (error) {
          contentEl.textContent = `Error: ${error.message}`;
        }
      }

      function renderIncidents(incidents) {
        incidentsContainer.innerHTML = '';
        incidents.forEach((incident) => {
          const wrap = document.createElement('div');
          wrap.className = 'group';

          const title = document.createElement('div');
          title.className = 'group-title';
          title.textContent = incident.id;
          wrap.appendChild(title);

          incident.files.forEach((fileName) => {
            const key = `incident:${incident.id}:${fileName}`;
            const link = createLink(fileName, () => openFile({
              key,
              label: `${incident.id} / ${fileName}`,
              scope: 'incident',
              section: incident.id,
              file: fileName,
            }), key);
            link.dataset.key = key;
            wrap.appendChild(link);
          });

          incidentsContainer.appendChild(wrap);
        });
      }

      function renderResources(sections) {
        resourcesContainer.innerHTML = '';
        Object.entries(sections).forEach(([section, files]) => {
          const wrap = document.createElement('div');
          wrap.className = 'group';

          const title = document.createElement('div');
          title.className = 'group-title';
          title.textContent = resourceLabels[section] || section;
          wrap.appendChild(title);

          files.forEach((fileName) => {
            const key = `resource:${section}:${fileName}`;
            const link = createLink(fileName, () => openFile({
              key,
              label: `${resourceLabels[section] || section} / ${fileName}`,
              scope: 'resource',
              section,
              file: fileName,
            }), key);
            link.dataset.key = key;
            wrap.appendChild(link);
          });

          resourcesContainer.appendChild(wrap);
        });
      }

      async function boot() {
        try {
          const [incidentsPayload, resourcesPayload] = await Promise.all([
            fetchJson('/api/incidents'),
            fetchJson('/api/resources'),
          ]);

          renderIncidents(incidentsPayload.incidents);
          renderResources(resourcesPayload.sections);
        } catch (error) {
          contentEl.textContent = `Startup error: ${error.message}`;
        }
      }

      boot();
    </script>
  </body>
</html>
